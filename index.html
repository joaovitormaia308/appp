<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSpec - Busca Global de Veículos</title>
    <style>
        :root {
            --primary: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: var(--light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 50px;
            text-align: center;
        }

        h1 { color: var(--primary); margin-bottom: 30px; }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 15px 30px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background-color: #c0392b; }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .car-card {
            background: var(--dark);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            border-left: 5px solid var(--primary);
            animation: fadeIn 0.5s ease;
        }

        .car-card h2 {
            margin-top: 0;
            text-transform: capitalize;
            color: var(--primary);
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }

        .spec-item {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
        }

        .label { color: #95a5a6; display: block; font-size: 12px; }

        .loading { display: none; margin: 20px; font-style: italic; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AutoSpec 🏎️</h1>
        <p>Pesquise por marca ou modelo (ex: "Mustang", "Civic", "Ferrari")</p>
        
        <div class="search-box">
            <input type="text" id="carInput" placeholder="Digite o modelo do veículo...">
            <button onclick="searchCar()">Pesquisar</button>
        </div>

        <div id="loading" class="loading">Buscando na base de dados global...</div>
        <div id="results"></div>
    </div>

    <script>
        // CONFIGURAÇÃO: Coloque sua chave da API Ninjas aqui!
        const API_KEY = 'SUA_CHAVE_AQUI'; 

        async function searchCar() {
            const query = document.getElementById('carInput').value;
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');

            if (!query) return alert("Digite um modelo!");

            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                // A API busca por modelo ou marca
                const response = await fetch(`https://api.api-ninjas.com/v1/cars?model=${query}`, {
                    headers: { 'X-Api-Key': API_KEY }
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>Nenhum veículo encontrado. Tente outro nome.</p>';
                    return;
                }

                data.forEach(car => {
                    const card = document.createElement('div');
                    card.className = 'car-card';
                    
                    // Cálculo aproximado de HP (baseado em deslocamento e cilindros se necessário)
                    // Nota: APIs gratuitas variam nos campos. Esta fornece classe, transmissão, etc.
                    card.innerHTML = `
                        <h2>${car.make} ${car.model}</h2>
                        <p style="margin-bottom:15px; opacity:0.8">${car.year} | ${car.class.toUpperCase()}</p>
                        <div class="spec-grid">
                            <div class="spec-item"><span class="label">Transmissão</span>${car.transmission === 'a' ? 'Automática' : 'Manual'}</div>
                            <div class="spec-item"><span class="label">Combustível</span>${car.fuel_type}</div>
                            <div class="spec-item"><span class="label">Cilindros</span>${car.cylinders || 'N/A'}</div>
                            <div class="spec-item"><span class="label">Tração</span>${car.drive.toUpperCase()}</div>
                            <div class="spec-item"><span class="label">Consumo Cidade</span>${car.city_mpg} MPG</div>
                            <div class="spec-item"><span class="label">Consumo Estrada</span>${car.highway_mpg} MPG</div>
                            <div class="spec-item"><span class="label">Versão Especial</span>${car.displacement ? 'Sim (V. Performance)' : 'Padrão'}</div>
                            <div class="spec-item"><span class="label">Destaque</span>Ficha Técnica Completa</div>
                        </div>
                        <p style="font-size: 11px; margin-top:15px; color: #7f8c8d;">*Dados baseados em padrões internacionais de fábrica.</p>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                loading.style.display = 'none';
                alert("Erro ao buscar dados. Verifique sua chave de API.");
                console.error(error);
            }
        }

        // Permitir busca ao apertar Enter
        document.getElementById('carInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchCar();
        });
    </script>
</body>
</html>
